# Mantém o banco (Supabase, plano gratuito) sempre acordado.
# Projetos gratuitos pausam após ~7 dias sem nenhum acesso; este ping diário
# garante que a loja fique no ar 24/7 mesmo em semanas sem visitas.
name: Manter loja acordada

on:
  schedule:
    - cron: '17 9 * * *'   # todo dia às 06:17 (horário de Brasília)
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping no catálogo
        run: |
          curl -sf "https://nppfqhavqahapmugnyng.supabase.co/rest/v1/el_config?select=chave&limit=1" \
            -H "apikey: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im5wcGZxaGF2cWFoYXBtdWdueW5nIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODU4NTAxMTIsImV4cCI6MjEwMTQyNjExMn0.Fb6mAvAuODy2mprKBc_w8tRaY5SYG9Nf9o2VKfuOXRA" \
            -o /dev/null -w "status %{http_code}\n"
